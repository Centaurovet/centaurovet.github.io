<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Insall & Scott — Consulta</title>
<style>
  :root{ --bg:#0E0E0E; --card:#16171b; --line:#26282f; --gold:#d4a96a; --txt:#eceae4; --muted:#8b8d96;
         --ok:#5fbf7f; --ok-bg:#12281a; --no:#e8836f; --no-bg:#2a1512; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;min-height:100dvh}
  header{padding:12px 16px calc(10px + env(safe-area-inset-top)) 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:5}
  header .logo{font-family:Georgia,serif;font-size:18px;color:var(--gold);font-weight:600}
  header .sub{font-size:11px;color:var(--muted);margin-top:2px}
  header .spacer{flex:1}
  header button.sair{background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:6px 10px;font-size:12px}
  #tabs{display:none;border-bottom:1px solid var(--line);background:var(--bg)}
  #tabs button{flex:1;background:none;border:none;color:var(--muted);padding:12px;font-size:14px;font-weight:600;
    border-bottom:2px solid transparent}
  #tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
  #login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:14px}
  #login .box{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
  #login h1{font-family:Georgia,serif;color:var(--gold);font-size:22px;margin:0 0 2px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 8px}
  input,select{width:100%;background:#0b0c0f;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:13px 12px;font-size:16px}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  button.primary{background:var(--gold);color:#1a1206;border:none;border-radius:10px;
    padding:13px;font-size:15px;font-weight:700}
  button.primary:active{opacity:.85}
  button.primary:disabled{opacity:.5}
  .err{color:#e8836f;font-size:13px;min-height:16px}
  #chat{flex:1;display:none;flex-direction:column;overflow:hidden}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .m{max-width:88%;padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .m.u{align-self:flex-end;background:#20222a;border:1px solid var(--line)}
  .m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
  .m.a strong{color:var(--gold)}
  .cite{color:var(--gold);font-size:12px}
  .hint{color:var(--muted);font-size:13px;text-align:center;margin:auto;padding:20px;max-width:320px}
  .typing{color:var(--muted);font-size:13px;font-style:italic}
  form#ask{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--bg)}
  #q{flex:1;resize:none;max-height:120px;font-size:16px}
  form#ask button{background:var(--gold);color:#1a1206;border:none;border-radius:10px;width:52px;font-size:20px;font-weight:700}
  form#ask button:disabled{opacity:.4}
  /* estudar */
  #estudar{flex:1;display:none;flex-direction:column;overflow:hidden}
  #estCfg{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  #estCfg label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:calc(50% - 3px);background:#0b0c0f;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px 8px;font-size:13px}
  .seg button.on{background:var(--gold);color:#1a1206;border-color:var(--gold);font-weight:700}
  .seg.small button{min-width:0}
  #capBusca{margin-bottom:8px}
  #capLista{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow-y:auto;background:#0b0c0f}
  .capRow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #1c1e24;font-size:14px}
  .capRow:last-child{border-bottom:none}
  .capRow input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--gold)}
  .capRow span{flex:1}
  .capSel{font-size:12px;color:var(--gold);margin-top:6px;min-height:16px}
  .divisor{text-align:center;color:var(--muted);font-size:12px;margin:2px 0}
  /* resumo */
  #resumo{flex:1;display:none;flex-direction:column;overflow:hidden}
  #resCfg{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  #resView{flex:1;display:none;flex-direction:column;overflow:hidden}
  #resBar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  #resOut{flex:1;overflow-y:auto;padding:16px}
  .resumoTxt{font-size:15px;line-height:1.65;white-space:pre-wrap}
  .resumoTxt strong{color:var(--gold)}
  #estQuiz{flex:1;display:none;flex-direction:column;overflow:hidden}
  #quizBar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  #quizBar .voltar{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:13px}
  #quizBar .score{margin-left:auto;font-size:13px;color:var(--gold);font-weight:700}
  #quizList{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .qcard .num{font-size:12px;color:var(--muted);margin-bottom:6px}
  .qcard .q{font-size:15px;line-height:1.5;margin-bottom:12px;white-space:pre-wrap}
  .opt{display:block;width:100%;text-align:left;background:#0b0c0f;border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:12px;font-size:14px;margin-bottom:8px;line-height:1.4}
  .opt.sel{border-color:var(--gold)}
  .opt.ok{background:var(--ok-bg);border-color:var(--ok)}
  .opt.no{background:var(--no-bg);border-color:var(--no)}
  .opt .letra{color:var(--gold);font-weight:700;margin-right:6px}
  .reveal{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.5;display:none}
  .reveal.show{display:block}
  .reveal .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:6px}
  .reveal .tag.ok{background:var(--ok-bg);color:var(--ok)}
  .reveal .tag.no{background:var(--no-bg);color:var(--no)}
  .reveal .pag{color:var(--gold);font-size:12px;margin-top:6px}
  .qbtns{display:flex;gap:8px;margin-top:10px}
  .qbtns button{flex:1;border-radius:10px;padding:11px;font-size:14px;font-weight:700;border:1px solid var(--line);background:#0b0c0f;color:var(--txt)}
  .qbtns button.acertei{border-color:var(--ok);color:var(--ok)}
  .qbtns button.errei{border-color:var(--no);color:var(--no)}
  .qbtns button.mostrar{border-color:var(--gold);color:var(--gold)}
  .verso{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.5;display:none;white-space:pre-wrap}
  .verso.show{display:block}
  /* painel de desempenho */
  #painelStats{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:2px}
  #painelStats h3{margin:0 0 4px;font-size:14px;color:var(--gold);font-family:Georgia,serif}
  #painelStats .resumo{font-size:12px;color:var(--muted);margin-bottom:8px}
  .statRow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #1c1e24;font-size:13px;cursor:pointer}
  .statRow .cnome{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .statRow .bar{flex:0 0 68px;height:6px;background:#0b0c0f;border-radius:4px;overflow:hidden}
  .statRow .bar>i{display:block;height:100%}
  .statRow .pct{flex:0 0 40px;text-align:right;font-weight:700}
  .statRow .cnt{flex:0 0 auto;font-size:11px;color:var(--muted)}
  .statActions{display:flex;gap:8px;margin-top:10px}
  .statActions button{flex:1;border-radius:10px;padding:10px;font-size:13px;font-weight:700;border:1px solid var(--line);background:#0b0c0f;color:var(--txt)}
  .statActions button.rev{border-color:var(--no);color:var(--no)}
  .statActions button.rev:disabled{opacity:.45;border-color:var(--line);color:var(--muted)}
  .statActions button.mais{border-color:var(--line);color:var(--muted)}
  .statVazio{font-size:12px;color:var(--muted)}
  .statZerar{font-size:11px;color:var(--muted);margin-top:8px;text-align:center;cursor:pointer}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">Insall &amp; Scott</div>
    <div class="sub">Surgery of the Knee · 6ª ed.</div>
  </div>
  <div class="spacer"></div>
  <button class="sair" id="btnSair" style="display:none" onclick="sair()">Sair</button>
</header>

<div id="tabs">
  <button id="tabConsultar" class="on" onclick="troca('consultar')">Consultar</button>
  <button id="tabResumo" onclick="troca('resumo')">Resumo</button>
  <button id="tabEstudar" onclick="troca('estudar')">Estudar</button>
</div>

<!-- LOGIN -->
<section id="login">
  <div class="box">
    <div>
      <h1>Consulta</h1>
      <p>Acesso pessoal. Use sua conta EquiVet.</p>
    </div>
    <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="e-mail">
    <input id="senha" type="password" autocomplete="current-password" placeholder="senha">
    <button class="primary" onclick="entrar()">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<!-- CONSULTAR -->
<section id="chat">
  <div id="msgs">
    <div class="hint">Pergunte sobre o joelho — anatomia, técnicas, classificações, complicações.
      As respostas citam capítulo e página do livro.</div>
  </div>
  <form id="ask" onsubmit="perguntar(event)">
    <textarea id="q" rows="1" placeholder="Sua pergunta…" oninput="autogrow(this)"></textarea>
    <button type="submit" id="send">➤</button>
  </form>
</section>

<!-- RESUMO -->
<section id="resumo">
  <!-- configuração -->
  <div id="resCfg">
    <div>
      <label>Capítulos (marque um ou vários)</label>
      <input id="resCapBusca" placeholder="Buscar capítulo…" oninput="filtraResCaps(this.value)">
      <div id="resCapLista"></div>
      <div class="capSel" id="resCapSelInfo">nenhum capítulo selecionado</div>
    </div>
    <div class="divisor">— ou —</div>
    <div>
      <label>Tema livre (usado se nenhum capítulo for marcado)</label>
      <input id="resTemaInp" placeholder="ex: menisco discoide, lesão do canto posterolateral">
    </div>
    <div>
      <label>Extensão</label>
      <div class="seg small" id="segExt">
        <button data-v="curto">Curto</button>
        <button data-v="medio" class="on">Médio</button>
        <button data-v="longo">Completo</button>
      </div>
    </div>
    <button class="primary" id="btnResumir" onclick="gerarResumo()">Gerar resumo</button>
    <div class="err" id="resErr"></div>
  </div>
  <!-- resultado -->
  <div id="resView">
    <div id="resBar">
      <button class="voltar" onclick="voltarResCfg()">‹ Novo</button>
      <button class="voltar" id="btnCopiar" onclick="copiarResumo()" style="margin-left:auto">Copiar</button>
    </div>
    <div id="resOut"></div>
  </div>
</section>

<!-- ESTUDAR -->
<section id="estudar">
  <!-- configuração -->
  <div id="estCfg">
    <div id="painelStats"></div>
    <div>
      <label>Formato</label>
      <div class="seg" id="segFmt">
        <button data-v="multipla" class="on">Múltipla escolha</button>
        <button data-v="dissertativa">Dissertativa</button>
        <button data-v="flashcard">Flashcards</button>
        <button data-v="caso">Caso clínico</button>
      </div>
    </div>
    <div>
      <label>Capítulos (marque um ou vários)</label>
      <input id="capBusca" placeholder="Buscar capítulo…" oninput="filtraCaps(this.value)">
      <div id="capLista"></div>
      <div class="capSel" id="capSelInfo">nenhum capítulo selecionado</div>
    </div>
    <div class="divisor">— ou —</div>
    <div>
      <label>Tema livre (usado se nenhum capítulo for marcado)</label>
      <input id="temaInp" placeholder="ex: menisco discoide, lesão do canto posterolateral">
    </div>
    <div>
      <label>Quantidade</label>
      <div class="seg small" id="segN">
        <button data-v="5" class="on">5</button>
        <button data-v="10">10</button>
        <button data-v="15">15</button>
      </div>
    </div>
    <button class="primary" id="btnGerar" onclick="gerar()">Gerar questões</button>
    <div class="err" id="estErr"></div>
  </div>
  <!-- quiz interativo -->
  <div id="estQuiz">
    <div id="quizBar">
      <button class="voltar" onclick="voltarCfg()">‹ Novo</button>
      <div class="score" id="score"></div>
    </div>
    <div id="quizList"></div>
  </div>
</section>

function lsGet(k,def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function getStats(){ return lsGet(LS_STATS,{}); }
function getErros(){ return lsGet(LS_ERR,[]); }
function qidDe(it){ const s=(it.q||it.frente||'')+'|'+(it.pagina||''); let h=5381;
  for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; } return 'q'+h; }

async function boot(){
  renderCaps('');
  renderResCaps('');
  $('segFmt').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('segFmt').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); fmt=b.dataset.v;
  });
  $('segN').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('segN').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); nq=parseInt(b.dataset.v);
  });
  $('segExt').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('segExt').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); extResumo=b.dataset.v;
  });
  const { data:{ session } } = await sb.auth.getSession();
  if (session) mostrarApp(); else mostrarLogin();
}
function mostrarLogin(){ $('login').style.display='flex'; $('tabs').style.display='none';
  $('chat').style.display='none'; $('resumo').style.display='none'; $('estudar').style.display='none';
  $('btnSair').style.display='none'; }
function mostrarApp(){ $('login').style.display='none'; $('tabs').style.display='flex';
  $('btnSair').style.display='block'; troca('consultar'); }
function troca(qual){
  $('chat').style.display = qual==='consultar' ? 'flex' : 'none';
  $('resumo').style.display = qual==='resumo' ? 'flex' : 'none';
  $('estudar').style.display = qual==='estudar' ? 'flex' : 'none';

  $('tabEstudar').classList.toggle('on', qual==='estudar');
  if(qual==='estudar') renderStats();
}

// ── capítulos (busca + checkboxes) ──
function renderCaps(filtro){
  const f=(filtro||'').toLowerCase();
  const lista=$('capLista');
  const vis=CAPS.filter(c=> !f || ('cap '+c.n+' '+c.t).toLowerCase().includes(f));
  lista.innerHTML = vis.slice(0,300).map(c=>`
    <label class="capRow">
      <input type="checkbox" value="${c.n}" ${capsSel.has(c.n)?'checked':''} onchange="toggleCap(${c.n},this.checked)">
      <span>Cap. ${c.n} — ${c.t}</span>
    </label>`).join('') || '<div class="capRow"><span style="color:var(--muted)">nada encontrado</span></div>';
}
function filtraCaps(v){ renderCaps(v); }
function toggleCap(n,on){ if(on) capsSel.add(n); else capsSel.delete(n); infoCaps(); }
function infoCaps(){
  const arr=[...capsSel].sort((a,b)=>a-b);
  $('capSelInfo').textContent = arr.length ? `${arr.length} selecionado(s): cap. ${arr.join(', ')}` : 'nenhum capítulo selecionado';
}

function toggleResCap(n,on){ if(on) resCapsSel.add(n); else resCapsSel.delete(n); infoResCaps(); }

async function entrar(){
  $('loginErr').textContent='';
  const email=$('email').value.trim(), senha=$('senha').value;
  if(!email||!senha){ $('loginErr').textContent='Preencha e-mail e senha.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password:senha });
  if(error){ $('loginErr').textContent='Falha no login. Confira os dados.'; return; }
  mostrarApp();
}
async function sair(){ await sb.auth.signOut(); location.reload(); }
function autogrow(t){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,120)+'px'; }
async function token(){ const { data:{ session } } = await sb.auth.getSession(); return session?.access_token; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── CONSULTAR ──
function fmtHtml(texto){
  return esc(texto)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(\[p\.[^\]]*\]|\[Insall[^\]]*\])/g,'<span class="cite">$1</span>');
}
function addMsg(texto, cls){
  const d=document.createElement('div'); d.className='m '+cls;
  if(cls==='a'){ d.innerHTML=fmtHtml(texto); } else { d.textContent=texto; }
  const hint=$('msgs').querySelector('.hint'); if(hint) hint.remove();
  $('msgs').appendChild(d); $('msgs').scrollTop=$('msgs').scrollHeight;
  return d;
}
async function perguntar(ev){
  ev.preventDefault();
  const q=$('q').value.trim(); if(!q) return;
  $('q').value=''; autogrow($('q')); $('send').disabled=true;
  addMsg(q,'u');
  const load=addMsg('consultando o livro…','a'); load.classList.add('typing');
  const tk=await token(); if(!tk){ load.remove(); mostrarLogin(); return; }
  try{
    const r=await fetch(BACKEND+'/insall',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},
      body:JSON.stringify({pergunta:q})});
    const data=await r.json().catch(()=>({})); load.remove();
    if(!r.ok){ addMsg(data.detail||'Erro ao consultar.','a'); }
    else{
      const el=addMsg(data.resposta||'Sem resposta.','a');
      if(!data.tem_literatura){ const w=document.createElement('div'); w.className='cite';
        w.style.marginTop='6px'; w.textContent='⚠︎ trecho do livro não recuperado — resposta pode ser incompleta';
        el.appendChild(w); }
    }
  }catch(e){ load.remove(); addMsg('Sem conexão com o servidor.','a'); }
  $('send').disabled=false;
}

// ── RESUMO (gerar síntese de capítulo(s) ou tema) ──
function voltarResCfg(){ $('resView').style.display='none'; $('resCfg').style.display='flex'; }

async function gerarResumo(){
  $('resErr').textContent='';
  const body={ extensao:extResumo };
  if(resCapsSel.size){ body.capitulos=[...resCapsSel]; }
  else{
    const tema=$('resTemaInp').value.trim();
    if(!tema){ $('resErr').textContent='Marque ao menos um capítulo ou digite um tema.'; return; }
    body.tema=tema;
  }
  $('btnResumir').disabled=true;
  const tk=await token(); if(!tk){ mostrarLogin(); return; }
  $('resCfg').style.display='none'; $('resView').style.display='flex';
  $('resOut').innerHTML='<div class="hint">Lendo o livro e preparando o resumo… (pode levar 20-40s)</div>';
  try{
    const r=await fetch(BACKEND+'/insall-resumo',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},
      body:JSON.stringify(body)});
    const data=await r.json().catch(()=>({}));
    if(!r.ok){ $('resOut').innerHTML='<div class="hint">'+esc(data.detail||'Erro ao gerar resumo.')+'</div>'; }
    else{
      resumoAtual = data.resumo || '';
      $('resOut').innerHTML = resumoAtual
        ? `<div class="resumoTxt">${fmtHtml(resumoAtual)}</div>`
        : '<div class="hint">Sem resumo.</div>';
      $('resOut').scrollTop=0;
    }
  }catch(e){ $('resOut').innerHTML='<div class="hint">Sem conexão com o servidor.</div>'; }
  $('btnResumir').disabled=false;
}

function copiarResumo(){
  if(!resumoAtual) return;
  const btn=$('btnCopiar');
  navigator.clipboard?.writeText(resumoAtual).then(()=>{
    const old=btn.textContent; btn.textContent='Copiado!';
    setTimeout(()=>{ btn.textContent=old; },1200);
  });
}

// ── ESTUDAR (gerar + quiz interativo) ──
function voltarCfg(){ $('estQuiz').style.display='none'; $('estCfg').style.display='flex'; renderStats(); }
function atualizaScore(){
  $('score').textContent = respFeitas ? `${respAcertos}/${respFeitas} certos` : `0/${respTotal}`;
}

async function gerar(){
  $('estErr').textContent='';
  const body={ formato:fmt, n:nq };
  if(capsSel.size){ body.capitulos=[...capsSel]; }
  else{
    const tema=$('temaInp').value.trim();
    if(!tema){ $('estErr').textContent='Marque ao menos um capítulo ou digite um tema.'; return; }
    body.tema=tema;
  }
  quizModo='normal'; quizCaps = capsSel.size ? [...capsSel] : [];
  $('btnGerar').disabled=true;
  const tk=await token(); if(!tk){ mostrarLogin(); return; }
  // mostra quiz view com loading
  $('estCfg').style.display='none'; $('estQuiz').style.display='flex';
  $('score').textContent='';
  $('quizList').innerHTML='<div class="hint">Elaborando as questões a partir do livro… (pode levar ~20-30s)</div>';
  try{
    const r=await fetch(BACKEND+'/insall-quiz',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},
      body:JSON.stringify(body)});
    const data=await r.json().catch(()=>({}));
    if(!r.ok){ $('quizList').innerHTML='<div class="hint">'+esc(data.detail||'Erro ao gerar questões.')+'</div>'; }
    else if(!data.itens){ $('quizList').innerHTML='<div class="hint">'+fmtHtml(data.texto||'Sem questões.')+'</div>'; }
    else{ renderQuiz(data.itens, data.formato); }
  }catch(e){ $('quizList').innerHTML='<div class="hint">Sem conexão com o servidor.</div>'; }
  $('btnGerar').disabled=false;
}

function renderQuiz(itens, formato){
  respTotal=itens.length; respAcertos=0; respFeitas=0; atualizaScore();
  const wrap=$('quizList'); wrap.innerHTML='';
  itens.forEach((it,i)=>{
    const card=document.createElement('div'); card.className='qcard';
    const num=`<div class="num">Questão ${i+1} de ${itens.length}</div>`;
    const f = it._fmt || formato;
    card.dataset.qid = qidDe(it);
    card.dataset.fmt = f;
    card.dataset.item = JSON.stringify(it);
    card.dataset.caps = JSON.stringify(quizModo==='revisao' ? (it._caps||[]) : quizCaps);
    if(f==='multipla'){
      const letras=['A','B','C','D'];
      const opts=letras.filter(L=>it.opcoes&&it.opcoes[L]!=null).map(L=>
        `<button class="opt" data-l="${L}" onclick="marcarMult(this)"><span class="letra">${L}</span>${esc(it.opcoes[L])}</button>`).join('');
      card.innerHTML = num + `<div class="q">${esc(it.q)}</div>` + opts +
        `<div class="reveal"><span class="tag"></span><div class="exp"></div>${it.pagina?`<div class="pag">[Insall 6ª ed., p.${esc(String(it.pagina))}]</div>`:''}</div>`;
      card.dataset.correta = (it.correta||'').trim().toUpperCase();
      card.dataset.exp = it.explicacao||'';
    } else if(f==='flashcard'){
      card.innerHTML = num + `<div class="q">${esc(it.frente)}</div>` +
        `<div class="verso">${fmtHtml(it.verso)}${it.pagina?`<div class="pag" style="color:var(--gold);font-size:12px;margin-top:6px">[Insall 6ª ed., p.${esc(String(it.pagina))}]</div>`:''}</div>` +
        `<div class="qbtns"><button class="mostrar" onclick="mostrarVerso(this)">Mostrar resposta</button></div>`;
    } else { // dissertativa | caso
      card.innerHTML = num + `<div class="q">${esc(it.q)}</div>` +
        `<div class="verso"><strong style="color:var(--gold)">Gabarito:</strong> ${fmtHtml(it.gabarito)}${it.pagina?`<div class="pag" style="color:var(--gold);font-size:12px;margin-top:6px">[Insall 6ª ed., p.${esc(String(it.pagina))}]</div>`:''}</div>` +
        `<div class="qbtns"><button class="mostrar" onclick="mostrarVerso(this)">Ver gabarito</button></div>`;
    }
    wrap.appendChild(card);
  });
  wrap.scrollTop=0;
}

function marcarMult(btn){
  const card=btn.closest('.qcard');
  if(card.dataset.done) return;               // já respondida
  card.dataset.done='1';
  const correta=card.dataset.correta;
  const escolhida=btn.dataset.l;
  card.querySelectorAll('.opt').forEach(o=>{
    o.style.pointerEvents='none';
    if(o.dataset.l===correta) o.classList.add('ok');
    if(o.dataset.l===escolhida && escolhida!==correta) o.classList.add('no');
  });
  const rev=card.querySelector('.reveal'); const tag=rev.querySelector('.tag');
  const acertou = escolhida===correta;
  tag.textContent = acertou?'✓ Correto':'✗ Incorreto';
  tag.className='tag '+(acertou?'ok':'no');
  rev.querySelector('.exp').innerHTML = fmtHtml(card.dataset.exp);
  rev.classList.add('show');
  respFeitas++; if(acertou) respAcertos++; atualizaScore();
  registrar(card, acertou);
}

function mostrarVerso(btn){
  const card=btn.closest('.qcard');
  card.querySelector('.verso').classList.add('show');
  btn.parentElement.innerHTML =
    `<button class="acertei" onclick="autoAval(this,true)">Acertei</button>`+
    `<button class="errei" onclick="autoAval(this,false)">Errei</button>`;
}
function autoAval(btn,acertou){
  const card=btn.closest('.qcard');
  if(card.dataset.done) return;
  card.dataset.done='1';
  btn.parentElement.querySelectorAll('button').forEach(b=>b.style.pointerEvents='none');
  btn.style.opacity='1';
  btn.parentElement.querySelectorAll('button').forEach(b=>{ if(b!==btn) b.style.opacity='.4'; });
  respFeitas++; if(acertou) respAcertos++; atualizaScore();
  registrar(card, acertou);
}

// ── registro de desempenho (localStorage) ──
function registrar(card, acertou){
  const id=card.dataset.qid;
  const caps=JSON.parse(card.dataset.caps||'[]');
  if(caps.length){
    const st=getStats();
    caps.forEach(n=>{ st[n]=st[n]||{feitas:0,acertos:0}; st[n].feitas++; if(acertou) st[n].acertos++; });
    lsSet(LS_STATS,st);
  }
  let err=getErros();
  if(quizModo==='revisao'){
    if(acertou){ lsSet(LS_ERR, err.filter(e=>e.id!==id)); }
  }else if(!acertou){
    if(!err.some(e=>e.id===id)){
      const it=JSON.parse(card.dataset.item); it._caps=caps; it._fmt=card.dataset.fmt;
      err.push({id, fmt:card.dataset.fmt, item:it, ts:Date.now()});
      lsSet(LS_ERR,err);
    }
  }else if(err.some(e=>e.id===id)){
    lsSet(LS_ERR, err.filter(e=>e.id!==id));
  }
}

// ── painel de estatísticas ──
function renderStats(){
  const el=$('painelStats'); if(!el) return;
  const st=getStats(), err=getErros();
  const rows=Object.keys(st).map(n=>({n:+n, feitas:st[n].feitas, acertos:st[n].acertos,
    pct: st[n].feitas ? st[n].acertos/st[n].feitas : 0})).filter(r=>r.feitas>0);
  if(!rows.length && !err.length){
    el.innerHTML='<h3>Meu desempenho</h3><div class="statVazio">Responda algumas questões (com capítulos marcados) para ver aqui onde você está mais fraco.</div>';
    return;
  }
  rows.sort((a,b)=> a.pct-b.pct || b.feitas-a.feitas);
  const totF=rows.reduce((a,r)=>a+r.feitas,0), totA=rows.reduce((a,r)=>a+r.acertos,0);
  const capT=n=>{ const c=CAPS.find(x=>x.n===n); return c?c.t:''; };
  const cor=p=> p<0.5?'var(--no)': p<0.75?'var(--gold)':'var(--ok)';
  const linha=r=>`<div class="statRow" onclick="focarCap(${r.n})">
      <span class="cnome">Cap. ${r.n} — ${esc(capT(r.n))}</span>
      <span class="cnt">${r.acertos}/${r.feitas}</span>
      <span class="bar"><i style="width:${Math.round(r.pct*100)}%;background:${cor(r.pct)}"></i></span>
      <span class="pct" style="color:${cor(r.pct)}">${Math.round(r.pct*100)}%</span>
    </div>`;
  const todos = el.dataset.todos==='1';
  const lista = todos ? rows : rows.slice(0,5);
  el.innerHTML =
    `<h3>Meu desempenho</h3>`+
    `<div class="resumo">${totA}/${totF} certos${totF?` · ${Math.round(totA/totF*100)}% geral`:''} · ${rows.length} cap. estudado(s)${rows.length>1?' · do mais fraco ao topo':''}</div>`+
    lista.map(linha).join('')+
    `<div class="statActions">`+
      `<button class="rev" ${err.length?'':'disabled'} onclick="revisarErros()">Revisar erros${err.length?` (${err.length})`:''}</button>`+
      (rows.length>5?`<button class="mais" onclick="toggleTodos()">${todos?'Ver menos':`Ver todos (${rows.length})`}</button>`:'')+
    `</div>`+
    `<div class="statZerar" onclick="limparStats()">zerar estatísticas e erros</div>`;
}
function toggleTodos(){ const el=$('painelStats'); el.dataset.todos = el.dataset.todos==='1'?'0':'1'; renderStats(); }
function focarCap(n){ capsSel.clear(); capsSel.add(n); $('capBusca').value=''; renderCaps(''); infoCaps();
  $('temaInp').value=''; $('btnGerar').scrollIntoView({behavior:'smooth',block:'center'}); }
function limparStats(){ if(confirm('Zerar todas as estatísticas e a lista de erros? Não dá para desfazer.')){
  lsSet(LS_STATS,{}); lsSet(LS_ERR,[]); const el=$('painelStats'); el.dataset.todos='0'; renderStats(); } }

// ── revisar erros ──
function revisarErros(){
  const err=getErros(); if(!err.length) return;
  quizModo='revisao'; quizCaps=[];
  const itens=err.map(e=>({...e.item, _fmt:e.fmt}));
  $('estCfg').style.display='none'; $('estQuiz').style.display='flex';
  $('score').textContent='';
  renderQuiz(itens, 'multipla');
}

$('q').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('ask').requestSubmit(); }
});
boot();
</script>
